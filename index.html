<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="/webstorm-icon-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WS playground</title>
  <link rel="stylesheet" href="src/estilo.css">
</head>
<body>

<main id="app">

  <h1 class="title">
    Calculadora básica <br /> Elementalia RPG
  </h1>

  <section class="calculadora">
    <div class="calculadoraDecision">
      <label for="dadoType"> Selecione tipo de dado </label>
      <select id="dadoType">
        <option value="3">d3</option>
        <option value="4">d4</option>
        <option value="6">d6</option>
        <option value="8">d8</option>
        <option value="10">d10</option>
        <option value="12">d12</option>
        <option value="20">d20</option>
      </select>
    </div>
    <div class="calculadoraMultiplier">
      <label for="dadoNumber"> Digite quantos dados você quer rolar: </label>
      <input type="number" id="dadoNumber">
    </div>
    <div class="calculadora-result">
      <button onclick="roll()">Calcular</button>
    </div>
    <div id="resultHtml">Aqui</div>
    <div id="resultDados">Valores</div>
  </section>

  <form action="/salvar-personagem" method="POST">
  <section>
  <input type="hidden" id="idPersonagem" name="id">
  <div>
    <input type="text" id="n" name="nome" placeholder="Nome:">
  </div>
  <div>
    <input type="text" id="e" name="elemento" placeholder="Elemento:">
  </div>
  </section>

  <section>
  <div id="statVida">
    <label>Vida:</label>
    <input id="hpMax" name="vidaMax" type="number" placeholder="Vida Maxima">
    <span> / </span>
    <input id="hpAtual" name="vidaAtual" type="number" placeholder="Vida Atual">
  </div>
  <div id="statFolego">
    <label>Folego:</label>
    <input id="folegoMax" name="folMax" type="number" placeholder="Folego Maximo">
    <span> / </span>
    <input id="folegoAtual" name="folAtual" type="number" placeholder="Folego Atual">
  </div>
  </section>

  <section>
  <div>
    <label>Força:</label>
    <input id="for" name="forca" type="number" placeholder="Força">
  </div>
  <div>
    <label>Agilidade:</label>
    <input id="agi" name="agilidade" type="number" placeholder="Agilidade">
  </div>
  <div>
    <label>Constituição:</label>
    <input id="con" name="constituicao" type="number" placeholder="Constituição">
  </div>
  <div>
    <label>Inteligencia:</label>
    <input id="int" name="inteligencia" type="number" placeholder="Inteligencia">
  </div>
  <div>
    <label>Carisma:</label>
    <input id="car" name="carisma" type="number" placeholder="Carisma">
  </div>
  <div>
    <label>Mente:</label>
    <input id="men" name="mente" type="number" placeholder="Mente">
  </div>
  </section>
    <button type="submit">Salvar personagem</button>
  </form>

  <div>
    <button id="btn-mostrar" type="button">Mostrar personagens</button>
  </div>
  <div id="lista-personagens">

  </div>
          
  <script src="src/main.js"></script>
