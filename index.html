<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="/webstorm-icon-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WS playground</title>
  <link rel="stylesheet" href="src/estilo.css">
</head>
<body>
<script src="src/main.js"></script>

<main id="app">

  <h1 class="title">
    Calculadora básica <br /> Elementalia RPG
  </h1>

  <section class="calculadora">
    <div class="calculadoraDecision">
      <label for="dadoType"> Selecione tipo de dado </label>
      <select id="dadoType">
        <option value="3">d3</option>
        <option value="4">d4</option>
        <option value="6">d6</option>
        <option value="8">d8</option>
        <option value="10">d10</option>
        <option value="12">d12</option>
        <option value="20">d20</option>
      </select>
    </div>
    <div class="calculadoraMultiplier">
      <label for="dadoNumber"> Digite quantos dados você quer rolar: </label>
      <input type="number" id="dadoNumber">
    </div>
    <div class="calculadora-result">
      <button onclick="roll()">Calcular</button>
    </div>
    <div id="resultHtml">Aqui</div>
    <div id="resultDados">Valores</div>
  </section>

  <section>
  <div>
    <input type="text" placeholder="Nome:">
  </div>
  <div>
    <input type="text" placeholder="Elemento:">
  </div>
  </section>

  <section>
  <div id="statVida">
    <label>Vida:</label>
    <input id="hpMax" type="number" placeholder="Vida Maxima">
    <span> / </span>
    <input id="hpAtual" type="number" placeholder="Vida Atual">
  </div>
  <div id="statFolego">
    <label>Folego:</label>
    <input id="folegoMax" type="number" placeholder="Folego Maximo">
    <span> / </span>
    <input id="folegoAtual" type="number" placeholder="Folego Atual">
  </div>
  </section>

  <section>
  <div>
    <label>Força:</label>
    <input id="for" type="number" placeholder="Força">
  </div>
  <div>
    <label>Agilidade:</label>
    <input id="agi" type="number" placeholder="Agilidade">
  </div>
  <div>
    <label>Constituição:</label>
    <input id="con" type="number" placeholder="Constituição">
  </div>
  <div>
    <label>Inteligencia:</label>
    <input id="int" type="number" placeholder="Inteligencia">
  </div>
  <div>
    <label>Carisma:</label>
    <input id="car" type="number" placeholder="Carisma">
  </div>
  <div>
    <label>Mente:</label>
    <input id="men" type="number" placeholder="Mente">
  </div>
  </section>
